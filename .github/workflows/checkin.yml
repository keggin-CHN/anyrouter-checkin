name: "🔄 AnyRouter 每日自动签到"

on:
  schedule:
    # 北京时间每天 09:00 = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  checkin:
    name: "纯协议签到"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📥 安装依赖"
        run: pip install -r requirements.txt

      - name: "🚀 签到"
        env:
          AR_USERNAME:  ${{ secrets.AR_USERNAME }}
          AR_PASSWORD:  ${{ secrets.AR_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py
